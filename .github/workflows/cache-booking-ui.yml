name: Vendor booking UI locally

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-booking-ui.yml'
      - 'scripts/cache-booking-ui.mjs'
      - 'scripts/booking-ui-manifest.json'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-booking-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and patch booking UI
        run: node scripts/cache-booking-ui.mjs

      - name: Verify complete local UI
        run: |
          test -s public/booking-ui/index.html
          test -s public/booking-ui/assets/app.js
          test -s public/booking-ui/assets/style.css
          test -s public/booking-ui/assets/config.js
          test $(find public/booking-ui -type f | wc -l) -ge 76
          du -sh public/booking-ui

      - name: Make normal builds local-only
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.build = 'vite build';
          pkg.scripts['vercel-build'] = 'npm run build';
          delete pkg.scripts.prebuild;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Commit local booking UI assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/booking-ui package.json
          if git diff --cached --quiet; then
            echo "No booking UI changes to commit"
            exit 0
          fi
          git commit -m "Vendor complete booking UI assets locally"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git push origin HEAD:main
          fi
